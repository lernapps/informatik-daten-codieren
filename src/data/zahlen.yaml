# Die Zahlen 3 bis 31 mit fünf Bit-Karten (16, 8, 4, 2, 1), erzeugt mit einem Skript (Content-Guide).
# dez: Dezimalzahl; bin: Binärzahl ohne führende Nullen; binZahl: ihre Ziffern als Zahl;
# gespiegelt: die Reste von oben nach unten gelesen (der typische Fehler), als Zahl; karten: Werte der offenen Karten;
# teilen: das fortgesetzte Teilen durch 2.
- dez: 3
  bin: "11"
  binZahl: 11
  gespiegelt: 11
  karten: "2 + 1"
  teilen:
    de: "3 : 2 = 1 Rest 1; 1 : 2 = 0 Rest 1"
    en: "3 ÷ 2 = 1 remainder 1; 1 ÷ 2 = 0 remainder 1"
