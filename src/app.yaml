# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: informatik/daten
title:
  de: Daten darstellen und codieren
  en: Representing and encoding data
intro:
  de: |
    Die Klasse 6b fährt an den Seeberg. Wer fährt mit, wohin, wann? Diese Information schreibst du immer wieder
    neu auf: als Tabelle und Baum, als Zahl aus Bits, als Pixelbild und als Geheimschrift, ein Jahr später in der 7b
    auch als Bytes und als Sprachnachricht. So lernst du, wie ein Computer alles mit 0 und 1 speichert. Kapitel 1
    bis 4 für die Klassen 5 und 6, Kapitel 5 für die Klassen 7 und 8.
  en: |
    Class 6b is going on a school trip to Seeberg. Who is going, where, and when? You will write down this information again and
    again in new ways: as a table and a tree, as a number made of bits, as a pixel image and in secret writing, and one year
    later in class 7b as bytes and as a voice message. This is how you learn how a computer stores everything with 0
    and 1. Chapters 1 to 4 for ages 10 to 12, chapter 5 for ages 12 to 14.
languages: [de, en]
tasks: { start: first }
chapters: [information, bits, bilder, geheim, texte]
