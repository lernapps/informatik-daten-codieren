# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Die Bit-Karten
  en: The bit cards
description:
  de: "Das Binärsystem mit Bit-Karten: Zahlen aus 0 und 1 lesen und in Dezimalzahlen umrechnen."
  en: "The binary system with bit cards: read numbers made of 0 and 1 and turn them into decimal numbers."
competencies: [binaersystem]
blocks:
  - type: section
    id: einstieg
    title:
      de: Ein Zimmer ohne Nummer
      en: A room without a number
    blocks:
      - type: text
        text:
          de: |
            Die 6b ist in der Jugendherberge „Am Seeberg“ angekommen. Jona und Selin suchen ihr Zimmer. Aber an den
            Türen steht keine Zimmernummer. An jeder Tür hängen fünf Karten. Eine offene Karte zeigt Punkte. Eine
            verdeckte Karte zeigt ihre Rückseite, und die hat keine Punkte. Über jeder Karte steht, wie viele Punkte
            sie offen hat. Diese Zahl ist der **Wert** der Karte.

            Hier lernst du, jede Zahl nur mit 0 und 1 zu schreiben: ein Code mit nur zwei Zeichen.
          en: |
            Class 6b has arrived at the youth hostel “Am Seeberg”. Jona and Selin are looking for their room. But there
            is no room number on the doors. On every door there are five cards. A card that is face up shows dots. A
            card that is face down shows its back, and the back has no dots. Above each card it says how many dots it
            has when it is face up. This number is the **value** of the card.

            Here you will learn to write any number with only 0 and 1: a code with only two symbols.
      - type: figure
        image: images/bit-karten-13.svg
        alt:
          de: "Fünf Karten nebeneinander mit den Werten 16, 8, 4, 2 und 1. Die Karten 8, 4 und 1 liegen offen und zeigen 8, 4 und 1 Punkte. Die Karten 16 und 2 sind verdeckt."
          en: "Five cards in a row with the values 16, 8, 4, 2 and 1. The cards 8, 4 and 1 are face up and show 8, 4 and 1 dots. The cards 16 and 2 are face down."
        caption:
          de: Die Karten an der Tür von Jona und Selin. Zähle die Punkte auf den offenen Karten.
          en: The cards on Jona and Selin's door. Count the dots on the cards that are face up.
        source:
          de: eigene Zeichnung
          en: own drawing
        licence: CC-BY-4.0
      - type: number
        id: karten-lesen
        text:
          de: Wie viele Punkte zeigen die offenen Karten zusammen? Das ist die Nummer des Zimmers.
          en: How many dots do the face-up cards show altogether? That is the room number.
        answer: 13
        tolerance: 0
        mistakes:
          - answer: 3
            message:
              de: Du hast die offenen Karten gezählt. Zähle ihre Punkte zusammen.
              en: You counted the face-up cards. Add up their dots.
          - answer: 31
            message:
              de: Du hast auch die verdeckten Karten mitgezählt. Eine verdeckte Karte zählt nicht.
              en: You also counted the face-down cards. A face-down card does not count.
        hint:
          de: Die Karte 8 hat 8 Punkte, die Karte 4 hat 4 Punkte.
          en: Card 8 has 8 dots, card 4 has 4 dots.
        explanation:
          de: "8 + 4 + 1 = 13. Jona und Selin schlafen in Zimmer 13."
          en: "8 + 4 + 1 = 13. Jona and Selin sleep in room 13."
  - type: section
    id: idee
    title:
      de: Eine Karte ist ein Bit
      en: One card is one bit
    blocks:
      - type: text
        text:
          de: |
            Jede Karte liegt entweder offen oder verdeckt. Für offen schreibst du **1**, für verdeckt **0**. Die Tür
            von Jona und Selin zeigt dann: verdeckt, offen, offen, verdeckt, offen. Kurz: **01101**. Diese Ziffern
            hintereinander nennt man eine **Bitfolge**.
          en: |
            Each card is either face up or face down. For face up you write **1**, for face down **0**. Then Jona and
            Selin's door shows: face down, face up, face up, face down, face up. In short: **01101**. These digits in a
            row are called a **bit string**.
      - type: definition
        term:
          de: Bit
          en: bit
        explanation:
          de: Ein Bit ist ein Zeichen mit nur zwei möglichen Werten, 0 oder 1.
          en: A bit is a symbol with only two possible values, 0 or 1.
      - type: definition
        term:
          de: Binärzahl
          en: binary number
        explanation:
          de: Eine Binärzahl schreibt man nur mit den Ziffern 0 und 1. Jede 1 zählt so viel wie der Wert ihrer Karte.
          en: A binary number is written only with the digits 0 and 1. Each 1 counts as much as the value of its card.
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: |
                Jede Karte ist doppelt so viel wert wie die Karte rechts neben ihr. Die größte Karte liegt links.
                Darum zählt es, **wo** eine 1 steht, nicht nur, wie viele Einsen es sind.

                Den Wert einer Stelle nennt man **Stellenwert**, wie bei Einern, Zehnern und Hundertern:
                Dort ist jede Stelle zehnmal so viel wert (**Dezimalsystem**). Bei den Karten ist jede Stelle doppelt
                so viel wert (**Binärsystem**). Nullen ganz vorne ändern nichts: 00101 ist dieselbe Zahl wie 101.
              en: |
                Each card is worth twice as much as the card to its right. The biggest card is on the left. That is why
                it matters **where** a 1 is, not just how many ones there are.

                The value of a place is called its **place value**. You know this from ones, tens and hundreds: there,
                each place is worth ten times as much (**decimal system**). With the cards, each place is worth twice
                as much (**binary system**). Zeros at the very front change nothing: 00101 is the same number as 101.
      - type: single-choice
        id: naechste-karte
        text:
          de: Jona will eine sechste Karte links neben die 16 legen. Welchen Wert muss sie haben?
          en: Jona wants to put a sixth card to the left of the 16. What value must it have?
        options:
          - text: { de: "32", en: "32" }
            correct: true
            info:
              de: 32 ist doppelt so viel wie 16. So geht die Reihe weiter.
              en: 32 is twice as much as 16. This is how the row goes on.
          - text: { de: "17", en: "17" }
            correct: false
            info:
              de: 17 ist nur 1 mehr als 16. Die Werte verdoppeln sich aber.
              en: 17 is only 1 more than 16. But the values double.
          - text: { de: "20", en: "20" }
            correct: false
            info:
              de: Bei 20 wäre der Abstand 4. Die Werte verdoppeln sich aber.
              en: With 20 the step would be 4. But the values double.
          - text: { de: "64", en: "64" }
            correct: false
            info:
              de: 64 wäre erst die siebte Karte, links neben der 32.
              en: 64 would be the seventh card, to the left of the 32.
        explanation:
          de: "1, 2, 4, 8, 16, 32: Jede Karte ist doppelt so viel wert."
          en: "1, 2, 4, 8, 16, 32: each card is worth twice as much."
  - type: section
    id: ausprobieren
    title:
      de: Ausprobieren
      en: Try it out
    blocks:
      - type: text
        text:
          de: |
            Tippe auf eine Karte, um sie umzudrehen. Unter den Karten siehst du die Bitfolge und die Zahl, die sie
            zeigt. „Alle verdecken“ dreht alle Karten wieder um.

            Finde heraus: Welche ist die kleinste Zahl, welche die größte? Gibt es dazwischen eine Zahl, die du nicht
            legen kannst?
          en: |
            Tap a card to turn it over. Below the cards you can see the bit string and the number it shows. “Turn all
            face down” turns all the cards over again.

            Find out: What is the smallest number, and what is the biggest? Is there a number in between that you
            cannot make?
      - type: vue-component
        component: BitReihe
        props:
          cards: 5
          card:
            de: "Karte {v}"
            en: "Card {v}"
          open:
            de: offen
            en: face up
          closed:
            de: verdeckt
            en: face down
          line:
            de: "Bitfolge: {b} · Zahl: {n}"
            en: "Bit string: {b} · Number: {n}"
          reset:
            de: Alle verdecken
            en: Turn all face down
        nojs:
          de: |
            Fünf Bit-Karten mit den Werten 16, 8, 4, 2 und 1, alle verdeckt. Tippt man auf eine Karte, dreht sie sich
            um. Darunter steht, welche Zahl die offenen Karten zeigen, zum Beispiel „Bitfolge: 00101 · Zahl: 5“ für
            die Karten 4 und 1. Sind alle Karten verdeckt, ist es 00000, also 0. Sind alle offen, ist es 11111, also 31.
          en: |
            Five bit cards with the values 16, 8, 4, 2 and 1, all face down. When you tap a card, it turns over. Below
            the cards you can read which number the face-up cards show, for example “Bit string: 00101 · Number: 5”
            for the cards 4 and 1. With all the cards face down it is 00000, which is 0. With all face up it is 11111,
            which is 31.
      - type: number
        id: wie-viele-zahlen
        text:
          de: Wie viele verschiedene Zahlen kannst du mit den fünf Karten legen? Zähle die 0 mit.
          en: How many different numbers can you make with the five cards? Count 0 as well.
        answer: 32
        tolerance: 0
        mistakes:
          - answer: 31
            message:
              de: "31 ist die größte Zahl. Aber auch die 0 zählt mit: Von 0 bis 31 sind es eine Zahl mehr."
              en: "31 is the biggest number. But 0 counts too: from 0 to 31 there is one number more."
          - answer: 5
            message:
              de: "5 ist die Zahl der Karten, nicht der Zahlen."
              en: "5 is the number of cards, not of numbers."
        hint:
          de: Lege die kleinste und die größte Zahl. Kannst du jede Zahl dazwischen legen?
          en: Make the smallest and the biggest number. Can you make every number in between?
        explanation:
          de: "Du kannst jede Zahl von 0 bis 31 legen, ohne Lücke. Das sind 32 Zahlen."
          en: "You can make every number from 0 to 31, with no gaps. That is 32 numbers."
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Welches Zimmer ist 10110?
          en: Which room is 10110?
        blocks:
          - type: figure
            image: images/bit-karten-22.svg
            alt:
              de: "Fünf Karten mit den Werten 16, 8, 4, 2 und 1. Die Karten 16, 4 und 2 liegen offen, die Karten 8 und 1 verdeckt. Darunter steht 1 0 1 1 0."
              en: "Five cards with the values 16, 8, 4, 2 and 1. The cards 16, 4 and 2 are face up, the cards 8 and 1 face down. Below it says 1 0 1 1 0."
            caption:
              de: Die Tür von Mias Zimmer
              en: The door of Mia's room
            source:
              de: eigene Zeichnung
              en: own drawing
            licence: CC-BY-4.0
          - type: text
            text:
              de: |
                1. Schau, welcher Wert über jeder Ziffer steht: 16, 8, 4, 2, 1.
                2. Nimm nur die Werte, unter denen eine 1 steht: 16, 4 und 2.
                3. Zähle sie zusammen: 16 + 4 + 2 = 22.

                Die Binärzahl 10110 ist die Dezimalzahl 22. Mia schläft in Zimmer 22.
              en: |
                1. Look at the value above each digit: 16, 8, 4, 2, 1.
                2. Take only the values that have a 1 below them: 16, 4 and 2.
                3. Add them up: 16 + 4 + 2 = 22.

                The binary number 10110 is the decimal number 22. Mia sleeps in room 22.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: true-false
        id: falsche-seite
        text:
          de: Die Binärzahlen 00111 und 11100 sind dieselbe Zahl, weil beide drei Einsen haben.
          en: The binary numbers 00111 and 11100 are the same number, because both have three ones.
        answer: false
        explanation:
          de: "Es kommt darauf an, wo die Einsen stehen. 00111 ist 4 + 2 + 1 = 7, aber 11100 ist 16 + 8 + 4 = 28."
          en: "It matters where the ones are. 00111 is 4 + 2 + 1 = 7, but 11100 is 16 + 8 + 4 = 28."
      - type: generated
        id: bits-lesen-ueben
        given:
          b4: { int: [0, 1] }
          b3: { int: [0, 1] }
          b2: { int: [0, 1] }
          b1: { int: [0, 1] }
          b0: { int: [0, 1] }
        where:
          - "b4 + b3 + b2 + b1 + b0 >= 2"
          - "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 16*b0 + 8*b1 + 4*b2 + 2*b3 + b4"
          - "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 13 and 16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 22"
          - "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 7 and 16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 28"
          - "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 9 and 16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 19"
        task:
          text:
            de: "Welche Dezimalzahl ist die Binärzahl {{b4}}{{b3}}{{b2}}{{b1}}{{b0}}?"
            en: "Which decimal number is the binary number {{b4}}{{b3}}{{b2}}{{b1}}{{b0}}?"
        answer:
          value: "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0"
          compare: { number: { format: integer } }
        mistakes:
          - value: "16*b0 + 8*b1 + 4*b2 + 2*b3 + b4"
            message:
              de: "Du hast von der falschen Seite gelesen. Die Karte 16 liegt links, die Karte 1 rechts."
              en: "You read from the wrong end. Card 16 is on the left, card 1 is on the right."
          - value: "b4 + b3 + b2 + b1 + b0"
            message:
              de: "Du hast die Einsen gezählt. Jede 1 zählt so viel wie die Karte, zu der sie gehört."
              en: "You counted the ones. Each 1 counts as much as the card it belongs to."
          - value: "10000*b4 + 1000*b3 + 100*b2 + 10*b1 + b0"
            message:
              de: "Du hast die Binärzahl abgeschrieben. Gesucht ist die Dezimalzahl."
              en: "You copied the binary number. You are looking for the decimal number."
        hint:
          de: "Male dir fünf Karten auf und schreibe 16, 8, 4, 2, 1 darüber."
          en: "Draw five cards and write 16, 8, 4, 2, 1 above them."
        steps:
          - de: "Werte über die Ziffern: 16 · {{b4}}, 8 · {{b3}}, 4 · {{b2}}, 2 · {{b1}}, 1 · {{b0}}."
            en: "Values above the digits: 16 · {{b4}}, 8 · {{b3}}, 4 · {{b2}}, 2 · {{b1}}, 1 · {{b0}}."
          - de: "Nur die Karten mit einer 1 zählen. Zusammen sind das {{answer}}."
            en: "Only the cards with a 1 count. Together that makes {{answer}}."
      - type: ordering
        id: zimmer-ordnen
        text:
          de: Ordne die Zimmernummern der Größe nach, die kleinste zuerst.
          en: Put the room numbers in order of size, the smallest first.
        items:
          - { de: "00111", en: "00111" }
          - { de: "01001", en: "01001" }
          - { de: "10000", en: "10000" }
          - { de: "10011", en: "10011" }
        explanation:
          de: "00111 ist 7, 01001 ist 9, 10000 ist 16 und 10011 ist 19."
          en: "00111 is 7, 01001 is 9, 10000 is 16 and 10011 is 19."
      - type: text
        text:
          de: Jetzt kannst du jede Binärzahl mit fünf Stellen lesen. Auf der nächsten Seite gehst du den Weg zurück und legst die Nummer des Busses, 27, selbst mit den Karten.
          en: Now you can read any binary number with five digits. On the next page you go the other way and make the number of the bus, 27, with the cards yourself.
