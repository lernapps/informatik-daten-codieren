# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Die Bit-Karten
  en: The bit cards
description:
  de: "Das Binärsystem mit Bit-Karten: Zahlen aus 0 und 1 lesen und in Dezimalzahlen umrechnen."
  en: "The binary system with bit cards: read numbers made of 0 and 1 and convert them to decimal numbers."
competencies: [binaersystem]
blocks:
  - type: section
    id: einstieg
    title:
      de: Ein Zimmer ohne Ziffern
      en: A room without digits
    blocks:
      - type: text
        text:
          de: |
            Die 6b ist in der Jugendherberge „Am Seeberg“ angekommen. Jona und Selin suchen ihr Zimmer. Aber an den
            Türen stehen keine Ziffern. An jeder Tür hängen fünf Karten. Manche Karten liegen offen, manche verdeckt.
            Über jeder Karte steht ihr Wert.

            Auf dieser Seite lernst du, wie man jede Zahl nur mit 0 und 1 schreibt. Das ist ein Code mit nur zwei
            Zeichen, wie bei den Codes auf der Seite davor.
          en: |
            Class 6b has arrived at the youth hostel “Am Seeberg”. Jona and Selin are looking for their room. But there
            are no digits on the doors. On every door there are five cards. Some cards are face up, some face down.
            The value of each card is written above it.

            On this page you will learn how to write any number with only 0 and 1. This is a code with only two
            symbols, like the codes on the page before.
      - type: figure
        image: images/bit-karten-13.svg
        alt:
          de: "Fünf Karten nebeneinander mit den Werten 16, 8, 4, 2 und 1. Die Karten 8, 4 und 1 liegen offen und zeigen 8, 4 und 1 Punkte. Die Karten 16 und 2 sind verdeckt. Unter den Karten steht 0 1 1 0 1."
          en: "Five cards in a row with the values 16, 8, 4, 2 and 1. The cards 8, 4 and 1 are face up and show 8, 4 and 1 dots. The cards 16 and 2 are face down. Below the cards it says 0 1 1 0 1."
        caption:
          de: Die Karten an der Tür von Jona und Selin. Zähle die Punkte auf den offenen Karten.
          en: The cards on Jona and Selin's door. Count the dots on the cards that are face up.
        source:
          de: eigene Zeichnung
          en: own drawing
        licence: CC-BY-4.0
      - type: number
        id: karten-lesen
        text:
          de: Wie viele Punkte zeigen die offenen Karten zusammen? Das ist die Nummer des Zimmers.
          en: How many dots do the face-up cards show altogether? That is the room number.
        answer: 13
        tolerance: 0
        mistakes:
          - answer: 3
            message:
              de: Du hast die offenen Karten gezählt. Zähle die Punkte auf jeder offenen Karte und zähle sie zusammen.
              en: You counted the face-up cards. Count the dots on each face-up card and add them up.
          - answer: 31
            message:
              de: Du hast auch die verdeckten Karten mitgezählt. Eine verdeckte Karte zählt nicht.
              en: You also counted the face-down cards. A face-down card does not count.
        hint:
          de: Die Karte 8 hat 8 Punkte, die Karte 4 hat 4 Punkte.
          en: Card 8 has 8 dots, card 4 has 4 dots.
        explanation:
          de: "8 + 4 + 1 = 13. Jona und Selin schlafen in Zimmer 13."
          en: "8 + 4 + 1 = 13. Jona and Selin sleep in room 13."
  - type: section
    id: idee
    title:
      de: Eine Karte ist ein Bit
      en: One card is one bit
    blocks:
      - type: text
        text:
          de: |
            Jede Karte kann nur zwei Zustände haben: offen oder verdeckt. Für offen schreibst du **1**, für verdeckt
            **0**. Die Tür von Zimmer 13 zeigt also die Ziffern 0 1 1 0 1.

            Schau dir die Werte über den Karten an: Jede Karte ist doppelt so viel wert wie die Karte rechts neben ihr.
            Die kleinste Karte liegt rechts.
          en: |
            Each card can only be in one of two states: face up or face down. For face up you write **1**, for face
            down **0**. So the door of room 13 shows the digits 0 1 1 0 1.

            Look at the values above the cards: each card is worth twice as much as the card to its right. The
            smallest card is on the right.
      - type: definition
        term:
          de: Bit
          en: bit
        explanation:
          de: Ein Bit ist die kleinste Einheit für Daten. Es hat genau zwei Werte, 0 oder 1, wie eine Karte, die verdeckt oder offen liegt.
          en: A bit is the smallest unit of data. It has exactly two values, 0 or 1, like a card that is face down or face up.
      - type: definition
        term:
          de: Binärzahl
          en: binary number
        explanation:
          de: Eine Binärzahl ist eine Zahl, die nur aus den Ziffern 0 und 1 besteht. Jede Stelle hat einen Wert, der doppelt so groß ist wie der Wert der Stelle rechts daneben.
          en: A binary number is a number made only of the digits 0 and 1. Each place has a value that is twice as big as the value of the place to its right.
      - type: table
        caption:
          de: Die Binärzahl 01101. Jede 1 zählt so viel wie der Wert über ihr.
          en: The binary number 01101. Each 1 counts as much as the value above it.
        header:
          - de: Wert der Karte
            en: Value of the card
          - { de: "16", en: "16" }
          - { de: "8", en: "8" }
          - { de: "4", en: "4" }
          - { de: "2", en: "2" }
          - { de: "1", en: "1" }
        rows:
          - - de: Ziffer
              en: Digit
            - { de: "0", en: "0" }
            - { de: "1", en: "1" }
            - { de: "1", en: "1" }
            - { de: "0", en: "0" }
            - { de: "1", en: "1" }
          - - de: zählt
              en: counts
            - { de: "0", en: "0" }
            - { de: "8", en: "8" }
            - { de: "4", en: "4" }
            - { de: "0", en: "0" }
            - { de: "1", en: "1" }
        rowHeaders: true
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: |
                Du liest eine Binärzahl so, wie du die Karten hinlegst: Die Karte mit dem größten Wert liegt links.
                Das Zahlensystem mit den Werten 1, 2, 4, 8, 16 … heißt **Binärsystem**. Wir schreiben Zahlen sonst im
                **Dezimalsystem** mit den Ziffern 0 bis 9 und den Werten 1, 10, 100 …
              en: |
                You read a binary number the way you lay out the cards: the card with the biggest value is on the
                left. The number system with the values 1, 2, 4, 8, 16 … is called the **binary system**. We usually
                write numbers in the **decimal system** with the digits 0 to 9 and the values 1, 10, 100 …
  - type: section
    id: ausprobieren
    title:
      de: Ausprobieren
      en: Try it out
    blocks:
      - type: text
        text:
          de: Tippe auf eine Karte, um sie umzudrehen. Unter den Karten siehst du die Bitfolge und die Zahl, die sie zeigt. „Alle verdecken“ dreht alle Karten wieder um. Finde heraus, welche Zahlen du legen kannst.
          en: Tap a card to turn it over. Below the cards you can see the bits and the number they show. “Turn all face down” turns all the cards over again. Find out which numbers you can lay out.
      - type: vue-component
        component: BitReihe
        props:
          cards: 5
          card:
            de: "Karte {v}"
            en: "Card {v}"
          open:
            de: offen
            en: face up
          closed:
            de: verdeckt
            en: face down
          line:
            de: "Bitfolge: {b} · Zahl: {n}"
            en: "Bits: {b} · number: {n}"
          reset:
            de: Alle verdecken
            en: Turn all face down
        nojs:
          de: |
            Fünf Bit-Karten mit den Werten 16, 8, 4, 2 und 1, alle verdeckt. Tippt man auf eine Karte, dreht sie sich
            um. Darunter steht, welche Zahl die offenen Karten zeigen, zum Beispiel „Bitfolge: 00101 · Zahl: 5“ für
            die Karten 4 und 1. Sind alle Karten offen, ist es die Bitfolge 11111 und die Zahl 31.
          en: |
            Five bit cards with the values 16, 8, 4, 2 and 1, all face down. When you tap a card, it turns over. Below
            the cards you can read which number the face-up cards show, for example “Bits: 00101 · number: 5” for the
            cards 4 and 1. When all the cards are face up, the bits are 11111 and the number is 31.
      - type: number
        id: groesste-zahl
        text:
          de: Welche Zahl ist die größte, die du mit diesen fünf Karten legen kannst?
          en: What is the biggest number you can lay out with these five cards?
        answer: 31
        tolerance: 0
        mistakes:
          - answer: 16
            message:
              de: "16 ist die größte Karte. Du darfst aber mehrere Karten offen hinlegen."
              en: "16 is the biggest card. But you can lay out several cards face up."
          - answer: 32
            message:
              de: "Für 32 brauchst du eine sechste Karte. Lege alle fünf Karten offen und zähle zusammen."
              en: "For 32 you need a sixth card. Lay out all five cards face up and add them up."
        explanation:
          de: "Liegen alle Karten offen, sind es 16 + 8 + 4 + 2 + 1 = 31. Mit fünf Karten legst du also jede Zahl von 0 bis 31."
          en: "With all the cards face up, it is 16 + 8 + 4 + 2 + 1 = 31. So with five cards you can lay out every number from 0 to 31."
      - type: single-choice
        id: naechste-karte
        text:
          de: Jona will eine sechste Karte links neben die 16 legen. Welchen Wert muss sie haben?
          en: Jona wants to put a sixth card to the left of the 16. What value must it have?
        options:
          - text: { de: "32", en: "32" }
            correct: true
            info:
              de: 32 ist doppelt so viel wie 16. So geht die Reihe weiter.
              en: 32 is twice as much as 16. This is how the row goes on.
          - text: { de: "17", en: "17" }
            correct: false
            info:
              de: 17 ist nur 1 mehr als 16. Jede Karte ist aber doppelt so viel wert wie ihre rechte Nachbarin.
              en: 17 is only 1 more than 16. But each card is worth twice as much as the card to its right.
          - text: { de: "20", en: "20" }
            correct: false
            info:
              de: Bei 20 wäre der Abstand 4. In der Reihe 1, 2, 4, 8, 16 verdoppelt sich der Wert aber jedes Mal.
              en: With 20 the step would be 4. But in the row 1, 2, 4, 8, 16 the value doubles every time.
          - text: { de: "64", en: "64" }
            correct: false
            info:
              de: 64 kommt erst nach der sechsten Karte.
              en: 64 comes after the sixth card.
        explanation:
          de: "Die Werte verdoppeln sich von rechts nach links: 1, 2, 4, 8, 16, 32."
          en: "The values double from right to left: 1, 2, 4, 8, 16, 32."
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Welches Zimmer ist 10110?
          en: Which room is 10110?
        blocks:
          - type: figure
            image: images/bit-karten-22.svg
            alt:
              de: "Fünf Karten mit den Werten 16, 8, 4, 2 und 1. Die Karten 16, 4 und 2 liegen offen, die Karten 8 und 1 verdeckt. Darunter steht 1 0 1 1 0."
              en: "Five cards with the values 16, 8, 4, 2 and 1. The cards 16, 4 and 2 are face up, the cards 8 and 1 face down. Below it says 1 0 1 1 0."
            caption:
              de: Die Tür von Mias Zimmer
              en: The door of Mia's room
            source:
              de: eigene Zeichnung
              en: own drawing
            licence: CC-BY-4.0
          - type: text
            text:
              de: |
                1. Schreibe über jede Ziffer den Wert ihrer Karte: 16, 8, 4, 2, 1.
                2. Nimm nur die Werte, unter denen eine 1 steht: 16, 4 und 2.
                3. Zähle sie zusammen: 16 + 4 + 2 = 22.

                Die Binärzahl 10110 ist die Dezimalzahl 22. Mia schläft in Zimmer 22.
              en: |
                1. Write the value of its card above each digit: 16, 8, 4, 2, 1.
                2. Take only the values that have a 1 below them: 16, 4 and 2.
                3. Add them up: 16 + 4 + 2 = 22.

                The binary number 10110 is the decimal number 22. Mia sleeps in room 22.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: true-false
        id: falsche-seite
        text:
          de: Die Binärzahlen 00111 und 11100 sind dieselbe Zahl, weil beide drei Einsen haben.
          en: The binary numbers 00111 and 11100 are the same number, because both have three ones.
        answer: false
        explanation:
          de: "Es kommt darauf an, wo die Einsen stehen. 00111 ist 4 + 2 + 1 = 7, aber 11100 ist 16 + 8 + 4 = 28."
          en: "It matters where the ones are. 00111 is 4 + 2 + 1 = 7, but 11100 is 16 + 8 + 4 = 28."
      - type: generated
        id: bits-lesen-ueben
        given:
          b4: { int: [0, 1] }
          b3: { int: [0, 1] }
          b2: { int: [0, 1] }
          b1: { int: [0, 1] }
          b0: { int: [0, 1] }
        where:
          - "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != 16*b0 + 8*b1 + 4*b2 + 2*b3 + b4"
          - "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0 != b4 + b3 + b2 + b1 + b0"
        task:
          text:
            de: "Welche Dezimalzahl ist die Binärzahl {{b4}}{{b3}}{{b2}}{{b1}}{{b0}}?"
            en: "Which decimal number is the binary number {{b4}}{{b3}}{{b2}}{{b1}}{{b0}}?"
        answer:
          value: "16*b4 + 8*b3 + 4*b2 + 2*b1 + b0"
          compare: { number: { format: integer } }
        mistakes:
          - value: "16*b0 + 8*b1 + 4*b2 + 2*b3 + b4"
            message:
              de: "Du hast von der falschen Seite gelesen. Die Karte 16 liegt links, die Karte 1 rechts."
              en: "You read from the wrong end. Card 16 is on the left, card 1 is on the right."
          - value: "b4 + b3 + b2 + b1 + b0"
            message:
              de: "Du hast die Einsen gezählt. Jede 1 zählt so viel wie die Karte, über der sie steht."
              en: "You counted the ones. Each 1 counts as much as the card it belongs to."
        hint:
          de: "Schreibe die Werte 16, 8, 4, 2, 1 über die Ziffern."
          en: "Write the values 16, 8, 4, 2, 1 above the digits."
        steps:
          - de: "Werte über die Ziffern: 16 · {{b4}}, 8 · {{b3}}, 4 · {{b2}}, 2 · {{b1}}, 1 · {{b0}}."
            en: "Values above the digits: 16 · {{b4}}, 8 · {{b3}}, 4 · {{b2}}, 2 · {{b1}}, 1 · {{b0}}."
          - de: "Nur die Karten mit einer 1 zählen. Zusammen sind das {{answer}}."
            en: "Only the cards with a 1 count. Together that makes {{answer}}."
      - type: ordering
        id: zimmer-ordnen
        text:
          de: Ordne die Zimmernummern der Größe nach, die kleinste zuerst.
          en: Put the room numbers in order of size, the smallest first.
        items:
          - { de: "00111", en: "00111" }
          - { de: "01001", en: "01001" }
          - { de: "10000", en: "10000" }
          - { de: "10011", en: "10011" }
        explanation:
          de: "00111 ist 7, 01001 ist 9, 10000 ist 16 und 10011 ist 19."
          en: "00111 is 7, 01001 is 9, 10000 is 16 and 10011 is 19."
      - type: text
        text:
          de: Jetzt kannst du jede Binärzahl mit fünf Stellen lesen. Auf der nächsten Seite gehst du den Weg zurück. Die Busnummer ist 27. Wie legst du sie mit den Karten?
          en: Now you can read any binary number with five digits. On the next page you go the other way. The bus number is 27. How do you lay it out with the cards?
