# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Daten deuten
  en: Interpreting data
description:
  de: "Daten im Zusammenhang deuten: Ist 21 ein Alter, eine Temperatur oder eine Uhrzeit?"
  en: "Interpreting data in its context: is 21 an age, a temperature or a time?"
competencies: [daten-interpretieren]
blocks:
  - type: section
    id: einstieg
    title:
      de: Was ist 21?
      en: What is 21?
    blocks:
      - type: text
        text:
          de: |
            Mia packt für die Klassenfahrt. Überall sieht sie die Zahl 21. Aber die 21 bedeutet jedes Mal etwas
            anderes.

            Auf der Seite davor hast du gesehen: Daten werden erst mit einem Zusammenhang zur Information. Auf dieser
            Seite deutest du Daten selbst.
          en: |
            Mia is packing for the school trip. She sees the number 21 everywhere. But each time, the 21 means
            something different.

            On the page before you saw that data only becomes information with a context. On this page you will work
            out what data means yourself.
      - type: matching
        id: was-ist-21
        text:
          de: Wo Mia die 21 sieht, und was sie bedeutet. Ordne zu.
          en: Where Mia sees 21, and what it means. Match them.
        pairs:
          - left:
              de: 21 auf dem Thermometer
              en: 21 on the thermometer
            right:
              de: Es sind 21 Grad warm.
              en: It is 21 degrees warm.
          - left:
              de: 21:00 auf dem Wecker
              en: 21:00 on the alarm clock
            right:
              de: Es ist 9 Uhr abends.
              en: It is 9 o'clock in the evening.
          - left:
              de: 21 Kerzen auf dem Kuchen ihrer Cousine
              en: 21 candles on her cousin's cake
            right:
              de: Die Cousine wird 21 Jahre alt.
              en: Her cousin is turning 21.
          - left:
              de: 21 auf dem Trikot
              en: 21 on the sports shirt
            right:
              de: Das ist die Rückennummer.
              en: That is the shirt number.
        explanation:
          de: Dieselben Daten, die Zahl 21, bedeuten je nach Zusammenhang etwas anderes. Das Thermometer, die Uhr oder der Kuchen sagen dir, wie du die 21 deuten musst.
          en: The same data, the number 21, means something different depending on the context. The thermometer, the clock or the cake tells you how to read the 21.
  - type: section
    id: idee
    title:
      de: Der Zusammenhang steht oft dabei
      en: The context is often written next to it
    blocks:
      - type: text
        text:
          de: |
            In einer Tabelle steht der Zusammenhang oft in der **Überschrift** einer Spalte oder bei einer
            **Einheit** wie Uhr, Grad oder Euro. Frau Berg hat den Plan für den ersten Tag am Seeberg geschickt.
          en: |
            In a table, the context is often in the **heading** of a column, or in a **unit** such as o'clock,
            degrees or euros. Ms Berg has sent the plan for the first day at Seeberg.
      - type: table
        caption:
          de: Plan für Montag am Seeberg
          en: Plan for Monday at Seeberg
        header:
          - de: Was
            en: What
          - de: Uhrzeit
            en: Time
          - de: Wie viele Kinder
            en: How many children
        rows:
          - - de: Ankunft
              en: Arrival
            - de: "11"
              en: "11"
            - de: "26"
              en: "26"
          - - de: Wanderung um den See
              en: Walk around the lake
            - de: "14 bis 17"
              en: "14 to 17"
            - de: "26"
              en: "26"
          - - de: Boot fahren
              en: Boat trip
            - de: "15"
              en: "15"
            - de: "8"
              en: "8"
          - - de: Nachtwanderung
              en: Night walk
            - de: "21"
              en: "21"
            - de: "21"
              en: "21"
        rowHeaders: true
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: Lies immer erst die Überschrift der Spalte, dann die Zahl. In der Zeile „Nachtwanderung“ steht zweimal 21. Die eine 21 ist eine Uhrzeit, die andere ist eine Anzahl von Kindern.
              en: Always read the column heading first, then the number. In the row “Night walk” there are two 21s. One 21 is a time, the other is a number of children.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: single-choice
        id: boot-15
        text:
          de: In der Zeile „Boot fahren“ steht die 15. Was bedeutet sie?
          en: In the row “Boat trip” there is a 15. What does it mean?
        options:
          - text:
              de: Das Boot fährt um 15 Uhr los.
              en: The boat leaves at 15:00.
            correct: true
            info:
              de: Die 15 steht in der Spalte „Uhrzeit“.
              en: The 15 is in the column “Time”.
          - text:
              de: 15 Kinder fahren Boot.
              en: 15 children go on the boat.
            correct: false
            info:
              de: Die Anzahl der Kinder steht in der Spalte rechts daneben. Dort steht 8.
              en: The number of children is in the column to the right. It says 8.
          - text:
              de: Die Bootsfahrt dauert 15 Minuten.
              en: The boat trip takes 15 minutes.
            correct: false
            info:
              de: Eine Dauer in Minuten steht nirgends im Plan. Die Spalte heißt „Uhrzeit“.
              en: The plan does not show how long anything takes in minutes. The column is called “Time”.
        explanation:
          de: Die Überschrift der Spalte sagt, wie du die Zahl deuten musst.
          en: The column heading tells you how to read the number.
      - type: number
        id: wanderung-dauer
        text:
          de: Wie viele Stunden dauert die Wanderung um den See?
          en: How many hours does the walk around the lake take?
        answer: 3
        tolerance: 0
        unit:
          de: Stunden
          en: hours
        mistakes:
          - answer: 31
            message:
              de: "Du hast 14 und 17 zusammengezählt. „14 bis 17“ ist aber eine Zeitspanne: von 14 Uhr bis 17 Uhr."
              en: "You added 14 and 17. But “14 to 17” is a time span: from 14:00 to 17:00."
          - answer: 26
            message:
              de: 26 ist die Zahl der Kinder. Gefragt ist, wie lange die Wanderung dauert.
              en: 26 is the number of children. The question is how long the walk takes.
        hint:
          de: Die Wanderung beginnt um 14 Uhr. Wann endet sie?
          en: The walk starts at 14:00. When does it end?
        explanation:
          de: Von 14 Uhr bis 17 Uhr sind es 3 Stunden.
          en: From 14:00 to 17:00 is 3 hours.
      - type: ordering
        id: tag-ordnen
        text:
          de: Ordne den Tag am Seeberg nach der Uhrzeit, das Früheste zuerst.
          en: Put the day at Seeberg in order of time, the earliest first.
        items:
          - de: Ankunft
            en: Arrival
          - de: Wanderung um den See
            en: Walk around the lake
          - de: Boot fahren
            en: Boat trip
          - de: Nachtwanderung
            en: Night walk
        explanation:
          de: "11 Uhr, 14 Uhr, 15 Uhr, 21 Uhr. Die Bootsfahrt beginnt, während die anderen noch wandern: Nur 8 Kinder fahren Boot."
          en: "11:00, 14:00, 15:00, 21:00. The boat trip starts while the others are still walking: only 8 children go on the boat."
      - type: true-false
        id: zahl-immer-gleich
        text:
          de: Eine Zahl bedeutet immer dasselbe, egal wo sie steht.
          en: A number always means the same thing, wherever it is.
        answer: false
        explanation:
          de: In der Zeile „Nachtwanderung“ steht zweimal 21. Einmal ist es eine Uhrzeit, einmal eine Anzahl von Kindern.
          en: In the row “Night walk” there are two 21s. One is a time, the other is a number of children.
      - type: text
        text:
          de: "Jetzt kannst du Daten in einer Tabelle richtig deuten. Auf der nächsten Seite schaust du zurück: Wie hat die 6b ihr Ziel gewählt? Dort zeigst du dieselben Daten auf verschiedene Arten."
          en: "Now you can read data in a table correctly. On the next page you look back: how did class 6b choose where to go? There you show the same data in different ways."
