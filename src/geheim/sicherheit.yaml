# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Wie sicher ist das?
  en: How secure is it?
description:
  de: "Verschlüsselungsverfahren vergleichen und beurteilen, wie sicher sie sind: Wie viele Schlüssel müsste jemand ausprobieren?"
  en: "Comparing encryption methods and judging how secure they are: how many keys would someone have to try?"
competencies: [verschluesselung-bewerten]
blocks:
  - type: section
    id: einstieg
    title:
      de: Die 6c probiert es
      en: Class 6c gives it a go
    blocks:
      - type: text
        text:
          de: |
            Die 6c hat ein Wort der 6b abgefangen. Sie weiß, dass die 6b mit der Caesar-Scheibe verschlüsselt. Nur den
            Schlüssel kennt sie nicht. Spiel die 6c: Drehe die Scheibe Schritt für Schritt, bis die Buchstaben
            außen neben den Geheimbuchstaben innen ein Wort ergeben. Tippe dann den Schlüssel ein und drücke „Prüfen“.

            Auf der Seite davor hast du mit Schlüssel ver- und entschlüsselt. Auf dieser Seite beurteilst du, wie
            sicher ein Verfahren ist.
          en: |
            Class 6c has intercepted a word from 6b. They know that 6b encrypts with the Caesar disc. They just don't
            know the key. Play class 6c: turn the disc step by step until the letters on the outside, next to the
            secret letters on the inside, make a word. Then type in the key and press “Check”.

            On the page before you encrypted and decrypted with a key. On this page you judge how secure a method is.
      - type: vue-component
        id: caesar-knacken
        component: CaesarScheibe
        props:
          mode: knacken
          task:
            de: "Das Geheimwort ist {geheim}. Finde den Schlüssel."
            en: "The secret word is {geheim}. Find the key."
          woerter: { data: woerter }
          min: 2
          max: 11
          field:
            de: Schlüssel
            en: Key
          turned:
            de: "Gedreht um {k}"
            en: "Turned by {k}"
          back:
            de: "−1"
            en: "−1"
          forward:
            de: "+1"
            en: "+1"
          mapping:
            de: "Die Scheibe zeigt, außen und innen: {list}"
            en: "The disc shows, outside and inside: {list}"
          mistakes:
            - de: Du hast in die andere Richtung gezählt. Der Schlüssel ist die Zahl, um die die Buchstaben beim Verschlüsseln vorwärts rücken.
              en: You counted the other way. The key is the number of places the letters move forwards when encrypting.
            - de: Eine Stelle zu weit. Prüfe einen Buchstaben auf der Scheibe nach.
              en: One place too far. Check one letter on the disc.
        examples:
          accepted:
            - { answer: "2", seed: 1 }
          rejected:
            - { answer: "24", seed: 1 }
  - type: section
    id: idee
    title:
      de: Alle Schlüssel ausprobieren
      en: Trying every key
    blocks:
      - type: text
        text:
          de: |
            Bei Caesar gibt es nur **25** Schlüssel, von 1 bis 25. Der Schlüssel 26 wäre wie 0: Nichts ändert sich.
            Wer alle 25 ausprobiert, findet die Nachricht sicher, auch ohne den Schlüssel. Bei der Skytale mit 9
            Buchstaben gibt es noch weniger sinnvolle Schlüssel.

            Anders ist ein **gemischtes Alphabet**: Jeder Buchstabe bekommt irgendeinen anderen, zum Beispiel A wird
            Q, B wird M und so weiter. Dann ist der Schlüssel die ganze Liste. Davon gibt es so viele, dass die Zahl
            27 Stellen hat. Das ist viel sicherer als Caesar, aber trotzdem nicht sicher: Weil jeder Buchstabe immer
            durch denselben ersetzt wird, verraten zum Beispiel häufige Buchstaben wie E etwas über den Text.
          en: |
            With Caesar there are only **25** keys, from 1 to 25. The key 26 would be like 0: nothing changes.
            Anyone who tries all 25 will definitely find the message, even without the key. With the scytale and 9
            letters there are even fewer sensible keys.

            A **mixed alphabet** is different: each letter gets any other letter, for example A becomes Q, B becomes M
            and so on. Then the key is the whole list. There are so many of these that the number has 27 digits. That is much more
            secure than Caesar, but still not secure: because each letter is always replaced by the same one, common
            letters such as E give away something about the text.
      - type: table
        caption:
          de: Wie viele Schlüssel jemand ausprobieren müsste
          en: How many keys someone would have to try
        header:
          - de: Verfahren
            en: Method
          - de: Schlüssel
            en: Keys
        rows:
          - [
              { de: Morsecode (keine Verschlüsselung), en: Morse code (not encryption) },
              { de: "keinen, jeder kennt die Tabelle", en: "none, everyone knows the table" },
            ]
          - [{ de: Caesar, en: Caesar }, { de: "25", en: "25" }]
          - [
              { de: gemischtes Alphabet, en: mixed alphabet },
              { de: eine Zahl mit 27 Stellen, en: a number with 27 digits },
            ]
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: |
                Ein sicheres Verfahren braucht **so viele Schlüssel**, dass niemand alle ausprobieren kann, und der
                **Schlüssel** muss **geheim** bleiben. Das ist nötig, aber noch nicht genug: Das Verfahren darf auch
                keine andere Lücke haben. Das Verfahren selbst darf jeder kennen. Heute verschlüsseln Computer mit
                Verfahren, die Fachleute lange geprüft haben, und mit riesigen Schlüsseln. Du schützt dich, indem du dein Passwort lang
                machst und es niemandem verrätst.
              en: |
                A secure method needs **so many keys** that nobody can try them all, and the **key** has to **stay
                secret**. That is needed, but not enough: the method must not have any other weak spot either. Everyone
                may know the method itself. Today computers encrypt with methods that experts have checked for a long
                time, and with huge keys. You protect yourself by making your password long and never telling it to anyone.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: number
        id: caesar-schluessel-zahl
        text:
          de: Wie viele Schlüssel muss die 6c bei Caesar höchstens ausprobieren, um jede Nachricht zu knacken?
          en: What is the largest number of keys class 6c has to try with Caesar to crack any message?
        answer: 25
        tolerance: 0
        mistakes:
          - answer: 26
            message:
              de: Der Schlüssel 26 dreht die Scheibe einmal ganz herum. Dann ändert sich nichts, das zählt nicht.
              en: The key 26 turns the disc all the way round. Then nothing changes, so it does not count.
          - answer: 1
            message:
              de: Die 6c kennt den Schlüssel nicht. Sie muss im schlimmsten Fall jeden ausprobieren.
              en: Class 6c does not know the key. In the worst case they have to try every one.
        explanation:
          de: Die Schlüssel 1 bis 25 verschieben jeweils anders. Nach höchstens 25 Versuchen ist die Nachricht lesbar.
          en: The keys 1 to 25 each shift differently. After at most 25 tries the message can be read.
      - type: ordering
        id: verfahren-ordnen
        text:
          de: Ordne die Verfahren nach ihrer Sicherheit, das unsicherste zuerst.
          en: Put the methods in order of how secure they are, the least secure first.
        items:
          - de: Morsecode (keine Verschlüsselung)
            en: Morse code (not encryption)
          - de: Caesar mit Schlüssel
            en: Caesar with a key
          - de: gemischtes Alphabet
            en: mixed alphabet
        explanation:
          de: Den Morsecode kann jeder lesen. Caesar hat 25 Schlüssel. Das gemischte Alphabet hat so viele, dass niemand alle ausprobieren kann. Ganz sicher ist aber auch das nicht.
          en: Anyone can read Morse code. Caesar has 25 keys. The mixed alphabet has so many that nobody can try them all. But even it is not completely secure.
      - type: true-false
        id: geheimes-verfahren
        text:
          de: Ein Verfahren ist sicher, wenn niemand weiß, wie es funktioniert.
          en: A method is secure if nobody knows how it works.
        answer: false
        explanation:
          de: Die 6c wusste, dass die 6b Caesar benutzt, und hat trotzdem probiert. Ob ein Verfahren sicher ist, hängt nicht davon ab, ob man es kennt. Es braucht sehr viele Schlüssel, und der Schlüssel muss geheim bleiben.
          en: Class 6c knew that 6b uses Caesar and still had a go. Whether a method is secure does not depend on whether people know it. It needs very many keys, and the key has to stay secret.
      - type: single-choice
        id: am-besten-schuetzen
        text:
          de: Welcher dieser drei Wege schützt die nächste Nachricht der 6b am besten?
          en: Which of these three ways protects class 6b's next message best?
        options:
          - text:
              de: Mit einem gemischten Alphabet, dessen Liste sie nur persönlich weitergibt
              en: With a mixed alphabet, whose list they only pass on in person
            correct: true
            info:
              de: Es gibt sehr viele Schlüssel, und der Schlüssel kommt nicht in falsche Hände.
              en: There are very many keys, and the key does not get into the wrong hands.
          - text:
              de: Mit Caesar und dem Schlüssel 25 statt 3
              en: With Caesar and the key 25 instead of 3
            correct: false
            info:
              de: Ein anderer Schlüssel hilft nicht. Die 6c probiert einfach alle 25 aus.
              en: A different key does not help. Class 6c simply tries all 25.
          - text:
              de: Mit dem Schlüssel gleich unter der Nachricht, damit Selin ihn nicht vergisst
              en: With the key written just below the message, so that Selin does not forget it
            correct: false
            info:
              de: Wer den Zettel findet, hat dann auch den Schlüssel. Der Schlüssel muss getrennt und geheim bleiben.
              en: Whoever finds the note then also has the key. The key must be kept separate and secret.
        explanation:
          de: Von diesen drei Wegen ist das der beste. Viele mögliche Schlüssel und ein geheimer Schlüssel sind nötig, damit eine Nachricht sicher ist.
          en: Of these three ways, this is the best. Many possible keys and a secret key are needed for a message to be secure.
      - type: matching
        id: verfahren-schluessel
        text:
          de: Wie viele Schlüssel hat das Verfahren? Ordne zu.
          en: How many keys does the method have? Match them.
        pairs:
          - left:
              de: Caesar
              en: Caesar
            right:
              de: "25"
              en: "25"
          - left:
              de: gemischtes Alphabet
              en: mixed alphabet
            right:
              de: eine Zahl mit 27 Stellen
              en: a number with 27 digits
          - left:
              de: Morsecode (keine Verschlüsselung)
              en: Morse code (not encryption)
            right:
              de: keinen, er ist nicht geheim
              en: none, it is not secret
        explanation:
          de: Je mehr Schlüssel es gibt, desto länger müsste jemand probieren.
          en: The more keys there are, the longer someone would have to try.
      - type: text
        text:
          de: |
            Rückblick auf die ganze App: Die Klassenfahrt hast du als Zettel, Tabelle, Diagramm und Baum gesehen, als
            Zahl aus Bits, als Pixelbild und als Geheimschrift. Immer war es dieselbe Information, nur anders
            dargestellt. Und ein Computer speichert jede dieser Formen am Ende mit 0 und 1.
          en: |
            Looking back on the whole app: you have seen the school trip as a note, a table, a chart and a tree, as a
            number made of bits, as a pixel picture and as secret writing. It was always the same information, just
            shown in a different way. And in the end, a computer stores every one of these forms with 0 and 1.
